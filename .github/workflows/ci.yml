# Сборочный конвейер ASR Hub.
#
# На каждый push и запрос на слияние — быстрый ярус: линтер, синтаксис
# сценариев и интерфейса, проверки без браузера, установщиков и сквозных
# прогонов (метки ставит tests/conftest.py по имени файла). Раз в сутки и по
# кнопке — полный набор с браузером: он идёт больше часа.
name: ci

on:
  push:
  pull_request:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: ruff
        run: >-
          pip install "ruff>=0.5" && ruff check server tests agent/asrhub-agent.py examples
          docs/generate.py docs/generate_api_full.py docs/assemble.py docs/make_screenshots.py
      - name: проверка типов
        # С 3.1.38 сервер и агент проходят mypy целиком (храповик по списку
        # чистых модулей больше не нужен): новое замечание останавливает сборку.
        run: |
          pip install "mypy>=1.10" -r requirements/base.txt
          python -m mypy --ignore-missing-imports --follow-imports=silent server/asrhub agent/asrhub-agent.py
      - name: синтаксис интерфейса
        run: |
          for f in server/asrhub/web/*.js; do node --check "$f"; done
      - name: ESLint и проверки помощников интерфейса
        run: |
          npx --yes eslint@9.17.0 --config eslint.config.mjs server/asrhub/web
          node --test tests/js/*.test.mjs
      - name: shellcheck
        run: |
          sudo apt-get install -y shellcheck
          shellcheck -S warning -s sh agent/asrhub-dialplan
          shellcheck -S warning agent/install.sh
          shellcheck -S error scripts/*.sh scripts/lib/*.sh

  fast:
    needs: lint
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements/*.txt
      - name: ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: зависимости
        run: pip install -r requirements/dev.txt
      - name: быстрый ярус
        # Параллельно по файлам: стенды модуля (сервер, браузер) живут в одном
        # процессе, а файлы расходятся по ядрам машины конвейера.
        run: >-
          python -m pytest tests -q -p no:cacheprovider -rf --timeout=600
          -n auto --dist loadfile
          -m "not web and not scripts and not drill and not slow"

  full:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      ASRHUB_REQUIRE_BROWSER: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/*.txt
      - name: ffmpeg и оболочки
        run: sudo apt-get update && sudo apt-get install -y ffmpeg shellcheck
      - name: зависимости и браузер
        run: |
          pip install -r requirements/dev.txt
          python -m playwright install --with-deps chromium
      - name: полный набор с покрытием
        run: >-
          python -m pytest tests -q -p no:cacheprovider -rf --timeout=900
          --cov=asrhub --cov-report=term:skip-covered --cov-report=xml:coverage.xml
      - name: отчёт о покрытии
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
      - name: пакет собирается и несёт агента и руководство
        run: |
          pip wheel --no-deps -w dist .
          python - <<'PY'
          import glob, zipfile
          имена = zipfile.ZipFile(glob.glob("dist/asrhub-*.whl")[0]).namelist()
          for нужно in ("share/asrhub/agent/asrhub-dialplan", "share/asrhub/docs/01-quickstart.md"):
              assert any(и.endswith(нужно) for и in имена), нужно
          PY

  docker:
    # Образ собирается раз в сутки и по кнопке: профиль minimal на процессоре,
    # контейнер поднимается и отвечает на /api/health. Сборка с видеокартой
    # и тяжёлыми движками — на своей машине (docker compose build).
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: сборка образа (minimal, cpu)
        run: >-
          docker build -f docker/Dockerfile --build-arg PROFILE=minimal
          --build-arg ACCEL=cpu -t asrhub:ci .
      - name: контейнер отвечает
        run: |
          docker run -d --name asrhub-ci -p 18080:8080 -e ASRHUB_ADMIN_PASSWORD=ci-password-1 asrhub:ci
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:18080/api/health >/dev/null; then echo готово; exit 0; fi
            sleep 2
          done
          docker logs asrhub-ci
          exit 1
