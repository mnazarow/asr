# Сборочный конвейер ASR Hub.
#
# На каждый push и запрос на слияние — быстрый ярус: линтер, синтаксис
# сценариев и интерфейса, проверки без браузера, установщиков и сквозных
# прогонов (метки ставит tests/conftest.py по имени файла). Раз в сутки и по
# кнопке — полный набор с браузером: он идёт больше часа.
name: ci

on:
  push:
  pull_request:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: ruff
        run: >-
          pip install "ruff>=0.5" && ruff check server tests agent/asrhub-agent.py examples
          docs/generate.py docs/generate_api_full.py docs/assemble.py docs/make_screenshots.py
      - name: синтаксис интерфейса
        run: |
          for f in server/asrhub/web/*.js; do node --check "$f"; done
      - name: shellcheck
        run: |
          sudo apt-get install -y shellcheck
          shellcheck -S warning -s sh agent/asrhub-dialplan
          shellcheck -S warning agent/install.sh
          shellcheck -S error scripts/*.sh scripts/lib/*.sh

  fast:
    needs: lint
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements/*.txt
      - name: ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: зависимости
        run: pip install -r requirements/dev.txt
      - name: быстрый ярус
        run: >-
          python -m pytest tests -q -p no:cacheprovider -rf --timeout=600
          -m "not web and not scripts and not drill and not slow"

  full:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      ASRHUB_REQUIRE_BROWSER: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/*.txt
      - name: ffmpeg и оболочки
        run: sudo apt-get update && sudo apt-get install -y ffmpeg shellcheck
      - name: зависимости и браузер
        run: |
          pip install -r requirements/dev.txt
          python -m playwright install --with-deps chromium
      - name: полный набор
        run: python -m pytest tests -q -p no:cacheprovider -rf --timeout=900
      - name: пакет собирается и несёт агента и руководство
        run: |
          pip wheel --no-deps -w dist .
          python - <<'PY'
          import glob, zipfile
          имена = zipfile.ZipFile(glob.glob("dist/asrhub-*.whl")[0]).namelist()
          for нужно in ("share/asrhub/agent/asrhub-dialplan", "share/asrhub/docs/01-quickstart.md"):
              assert any(и.endswith(нужно) for и in имена), нужно
          PY
