<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ASR Hub — сервер распознавания речи</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<a class="skip-link" href="#content">Перейти к содержимому</a>
<div class="app">
  <aside class="sidebar" id="sidebar" aria-label="Разделы">
    <div class="brand">
      <div class="brand-mark">AH</div>
      <div>
        <div class="brand-name">ASR Hub</div>
        <div class="brand-sub">Распознавание речи</div>
      </div>
    </div>

    <nav class="nav" id="nav" aria-label="Основная навигация">
      <div class="nav-group">Работа</div>
      <button class="nav-item active" data-view="transcribe">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 2a3 3 0 0 1 3 3v6a3 3 0 0 1-6 0V5a3 3 0 0 1 3-3z"/><path d="M19 10v1a7 7 0 0 1-14 0v-1M12 18v4"/></svg>
        Транскрибация
      </button>
      <button class="nav-item" data-view="dictation">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 12h2l2-5 3 10 3-14 3 12 2-3h3"/></svg>
        Диктовка
      </button>
      <button class="nav-item" data-view="queue">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 6h18M3 12h18M3 18h12"/></svg>
        Очередь <span class="nav-badge" id="badge-queue">0</span>
      </button>
      <button class="nav-item" data-view="results">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M9 13h6M9 17h4"/></svg>
        Результаты
      </button>

      <div class="nav-group">Анализ</div>
      <button class="nav-item" data-view="analytics">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 3v18h18"/><path d="M7 15l4-5 3 3 5-7"/></svg>
        Аналитика
      </button>
      <button class="nav-item" data-view="models">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
        Модели <span class="nav-badge" id="badge-models">0</span>
      </button>
      <button class="nav-item" data-view="compare">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h4M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M12 3v18"/></svg>
        Сравнение моделей
      </button>

      <div class="nav-group">Управление</div>
      <button class="nav-item" data-view="settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-2.9 1.2V21a2 2 0 1 1-4 0v-.1A1.7 1.7 0 0 0 7 19.4a1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0-1.2-2.9H1a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 2.6 7a1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H7a1.7 1.7 0 0 0 1-1.5V1a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V7a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
        Настройки <span class="nav-badge" id="badge-params">0</span>
      </button>
      <button class="nav-item" data-view="system">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M6 8h.01M6 12h.01M10 8h8M10 12h8M10 16h5"/></svg>
        Сервер
      </button>
      <button class="nav-item" data-view="monitoring">
        Мониторинг <span class="nav-badge" id="badge-alerts">0</span>
      </button>
      <button class="nav-item" data-view="logs">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 4h16v16H4z"/><path d="M8 9h8M8 13h8M8 17h4"/></svg>
        Журнал
      </button>
      <button class="nav-item" data-view="help">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="10"/><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3M12 17h.01"/></svg>
        Справка
      </button>
    </nav>

    <div class="sidebar-foot">
      <div id="conn-status" role="status" aria-live="polite"><span class="status-dot warn"></span>подключение…</div>
      <div class="row">
        <span id="version-label">v3.0.0</span>
        <span class="spacer"></span>
        <button class="ghost sm" id="theme-toggle" title="Сменить тему">◐</button>
      </div>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="ghost icon nav-toggle" id="nav-toggle"
              aria-label="Открыть меню разделов" aria-expanded="false" aria-controls="sidebar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
      <div>
        <h1 id="view-title">Транскрибация</h1>
        <div class="sub" id="view-subtitle">Загрузка файлов и распознавание речи</div>
      </div>
      <div class="topbar-actions">
        <span class="chip" id="chip-queue">очередь: 0</span>
        <span class="chip" id="chip-workers">воркеры: 0/0</span>
        <button class="ghost icon" id="btn-refresh" title="Обновить">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
        </button>
      </div>
    </header>

    <main class="content" id="content" tabindex="-1"></main>
  </div>
</div>

<div class="toasts" id="toasts" role="status" aria-live="polite" aria-atomic="false"></div>
<div class="chart-tip" id="chart-tip"></div>

<script src="/static/charts.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
