# Сборка пакета. Раздел [project] был декоративным: без [build-system],
# зависимостей и точки входа «pip install .» в клоне падал на «Multiple
# top-level packages discovered in a flat-layout: agent, server, docker».
# Пакет — только каталог server/asrhub; зависимости — те же, что ставит
# установщик (requirements/base.txt), движки — отдельно, как и прежде.
[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "asrhub"
version = "3.1.27"
description = "Сервер распознавания речи на свободных моделях: GigaAM, Whisper и другие"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ASR Hub" }]
keywords = ["asr", "speech-recognition", "whisper", "gigaam", "распознавание речи"]
dynamic = ["dependencies"]

# Ссылка на документацию была путём «docs/README.md» — такого файла нет, а
# адрес без схемы pip отвергал предупреждением; ссылки убраны.

[project.scripts]
asrhub = "asrhub.__main__:main"

[tool.setuptools.packages.find]
where = ["server"]
include = ["asrhub*"]

[tool.setuptools.package-data]
# Веб-интерфейс — не модули Python, без этой строки в пакет он не попадал.
asrhub = ["web/*"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements/base.txt"] }

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["docs", ".venv", "venv", "build"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "I", "C4", "SIM"]
ignore = [
    # Depends() в значениях по умолчанию — штатный приём FastAPI
    "B008",
    # Длинные строки в каталоге: описания параметров и моделей читаемее целиком
    "E501",
    # Явные сравнения в проверках конфигурации нагляднее
    "SIM108",
    # try/except/pass в местах, где сбой заведомо не важен (журналирование,
    # освобождение памяти, разбор необязательных полей), читается яснее,
    # чем contextlib.suppress: видно, что именно игнорируется и почему.
    "SIM105",
    "SIM102",
    "SIM103",
]

[tool.ruff.lint.per-file-ignores]
"server/asrhub/catalog/*.py" = ["E501"]
"tests/*.py" = ["S101"]
# Словари аналитики записей — это списки слов, и записаны они строками,
# которые режутся по пробелу. Правило SIM905 право в общем случае, но здесь
# оно превратило бы сотни слов в стену закавыченных строк: словарь, который
# нельзя прочитать глазами, никто и не поправит.
"server/asrhub/content/lexicons.py" = ["SIM905"]
"server/asrhub/content/indices.py" = ["SIM905"]
"server/asrhub/content/names.py" = ["SIM905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["server"]
addopts = "-q --tb=short"
# Медленные проверки — те, что гоняют полный цикл задания через очередь.
# Отдельная метка нужна, чтобы их можно было пропустить: `-m "not slow"`.
markers = ["slow: полный цикл через очередь, десятки секунд"]
filterwarnings = ["ignore::DeprecationWarning"]
