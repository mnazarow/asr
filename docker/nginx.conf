# Обратный прокси для ASR Hub.
#
# Важные моменты, из-за которых чаще всего ломается загрузка файлов:
#   client_max_body_size — по умолчанию всего 1 МБ, и загрузка обрывается
#                          с ошибкой 413 при полностью рабочем сервере;
#   proxy_read_timeout   — распознавание длинных записей занимает минуты;
#   поддержка WebSocket  — без неё не работает живое обновление интерфейса
#                          (/ws) и диктовка (/api/stream);
#   Host $http_host      — с портом: вход по паролю сверяет адрес страницы
#                          (Origin) с Host, и $host без порта на нестандартном
#                          порту отвергал бы каждый запрос как «с чужой страницы».

# Имя сервера разрешается на каждом запросе через встроенный DNS Docker.
# С обычным блоком upstream nginx разрешает имя один раз при старте и, если
# контейнер сервера ещё не поднялся, выходит с ошибкой «host not found in
# upstream» — прокси не запускался вообще и не поднимался сам собой.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;

    # Переход на HTTPS: раскомментируйте три строки ниже (и блок server с
    # listen 443 в конце файла). Не одной строкой «return 301» на весь
    # сервер, как было: она перенаправляла и /healthz, по которому контейнер
    # прокси проверяет сам себя, — curl получал 301, и прокси считался
    # нездоровым при полностью рабочем HTTPS.
    # set $asrhub_redirect 1;
    # if ($uri = /healthz) { set $asrhub_redirect 0; }
    # if ($asrhub_redirect) { return 301 https://$host$request_uri; }

    client_max_body_size 4G;
    client_body_timeout 600s;
    proxy_read_timeout 1800s;
    proxy_send_timeout 1800s;
    proxy_connect_timeout 30s;
    proxy_buffering off;
    proxy_request_buffering off;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # Проверка самого прокси: отвечает, даже когда сервер недоступен.
    # Нужна для healthcheck контейнера — иначе его состояние зависело бы от
    # чужого сервиса и «нездоровым» считался бы работающий прокси.
    location = /healthz {
        access_log off;
        return 200 "nginx ok\n";
        add_header Content-Type text/plain;
    }

    location / {
        set $asrhub_backend "http://asrhub:8080";
        proxy_pass $asrhub_backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # Живое обновление очереди и прогресса
    location /ws {
        set $asrhub_backend "http://asrhub:8080";
        proxy_pass $asrhub_backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
    }

    # Диктовка: звук кусками внутрь, текст по ходу наружу — тот же WebSocket.
    # Без этого блока запрос попадал в «location /» с пустым Connection и без
    # Upgrade, и через прокси — а ради https для микрофона его и ставят —
    # диктовка не работала вовсе.
    location = /api/stream {
        set $asrhub_backend "http://asrhub:8080";
        proxy_pass $asrhub_backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Метрики и здоровье сервиса отдаём только из внутренней сети.
    # Один префикс на всё: подсистема мониторинга живёт под /api/monitoring/,
    # и раньше правило закрывало только /api/metrics, а полный снимок с
    # именами файлов в метках оставался открыт наружу.
    location ~ ^/api/(metrics|monitoring)(/|$) {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow 127.0.0.1;
        deny all;

        set $asrhub_backend "http://asrhub:8080";
        proxy_pass $asrhub_backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

