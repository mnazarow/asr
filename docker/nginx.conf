# Обратный прокси для ASR Hub.
#
# Важные моменты, из-за которых чаще всего ломается загрузка файлов:
#   client_max_body_size — по умолчанию всего 1 МБ, и загрузка обрывается
#                          с ошибкой 413 при полностью рабочем сервере;
#   proxy_read_timeout   — распознавание длинных записей занимает минуты;
#   поддержка WebSocket  — без неё не работает живое обновление интерфейса.

upstream asrhub {
    server asrhub:8080;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # Раскомментируйте для принудительного перехода на HTTPS
    # return 301 https://$host$request_uri;

    client_max_body_size 4G;
    client_body_timeout 600s;
    proxy_read_timeout 1800s;
    proxy_send_timeout 1800s;
    proxy_connect_timeout 30s;
    proxy_buffering off;
    proxy_request_buffering off;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    location / {
        proxy_pass http://asrhub;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # Живое обновление очереди и прогресса
    location /ws {
        proxy_pass http://asrhub;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
    }

    # Метрики отдаём только из внутренней сети
    location /api/metrics {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow 127.0.0.1;
        deny all;
        proxy_pass http://asrhub;
    }
}

