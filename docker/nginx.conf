# Обратный прокси для ASR Hub.
#
# Важные моменты, из-за которых чаще всего ломается загрузка файлов:
#   client_max_body_size — по умолчанию всего 1 МБ, и загрузка обрывается
#                          с ошибкой 413 при полностью рабочем сервере;
#   proxy_read_timeout   — распознавание длинных записей занимает минуты;
#   поддержка WebSocket  — без неё не работает живое обновление интерфейса.

# Имя сервера разрешается на каждом запросе через встроенный DNS Docker.
# С обычным блоком upstream nginx разрешает имя один раз при старте и, если
# контейнер сервера ещё не поднялся, выходит с ошибкой «host not found in
# upstream» — прокси не запускался вообще и не поднимался сам собой.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;

    # Раскомментируйте для принудительного перехода на HTTPS
    # return 301 https://$host$request_uri;

    client_max_body_size 4G;
    client_body_timeout 600s;
    proxy_read_timeout 1800s;
    proxy_send_timeout 1800s;
    proxy_connect_timeout 30s;
    proxy_buffering off;
    proxy_request_buffering off;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # Проверка самого прокси: отвечает, даже когда сервер недоступен.
    # Нужна для healthcheck контейнера — иначе его состояние зависело бы от
    # чужого сервиса и «нездоровым» считался бы работающий прокси.
    location = /healthz {
        access_log off;
        return 200 "nginx ok\n";
        add_header Content-Type text/plain;
    }

    location / {
        set $asrhub_backend "http://asrhub:8080";
        proxy_pass $asrhub_backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # Живое обновление очереди и прогресса
    location /ws {
        set $asrhub_backend "http://asrhub:8080";
        proxy_pass $asrhub_backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
    }

    # Метрики и здоровье сервиса отдаём только из внутренней сети.
    # Один префикс на всё: подсистема мониторинга живёт под /api/monitoring/,
    # и раньше правило закрывало только /api/metrics, а полный снимок с
    # именами файлов в метках оставался открыт наружу.
    location ~ ^/api/(metrics|monitoring)(/|$) {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow 127.0.0.1;
        deny all;

        set $asrhub_backend "http://asrhub:8080";
        proxy_pass $asrhub_backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

