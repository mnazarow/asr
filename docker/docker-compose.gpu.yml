# Надстройка для запуска на видеокарте NVIDIA.
#
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml \
#                  --profile proxy up -d
#
# Требуется NVIDIA Container Toolkit на хосте:
#   nvidia-ctk --version && docker run --rm --gpus all nvidia/cuda:12.4.0-base-ubuntu22.04 nvidia-smi

services:

  asrhub:
    build:
      args:
        PROFILE: ${ASRHUB_PROFILE:-full}
        ACCEL: cuda
        # Индекс PyTorch под драйвер хоста; установщик пишет его в .env по
        # версии CUDA (как и для обычной установки). Был зашит cu124 — на
        # нём последний torch не знает RTX 50xx (sm_120): карта видна, а
        # вычисления падают с «no kernel image is available».
        TORCH_INDEX: ${ASRHUB_TORCH_INDEX:-https://download.pytorch.org/whl/cu128}
    image: asrhub:${ASRHUB_TAG:-cuda}
    environment:
      # Устройство и точность — без значений: передаются, только если
      # заданы в .env. Сервер и так возьмёт карту при device: auto, а
      # заданные здесь cuda и float16 перекрывали сохранённое в интерфейсе
      # после каждого перезапуска.
      ASRHUB_DEVICE:
      ASRHUB_COMPUTE_TYPE:
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: ${GPU_COUNT:-1}
              capabilities: [gpu]
    healthcheck:
      # Первая загрузка весов на видеокарту дольше процессорной.
      start_period: 180s
