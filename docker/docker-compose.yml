# ASR Hub — развёртывание через Docker Compose.
#
#   docker compose up -d                                    сервер на процессоре
#   docker compose -f docker-compose.yml -f docker-compose.proxy.yml up -d
#                                       сервер за nginx, прямой порт закрыт
#   docker compose --profile proxy up -d                    nginx и прямой порт
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d
#                                                           сервер с видеокартой
#
# Вариант с видеокартой — файл-надстройка, а не отдельный сервис. Раньше
# сервер с CUDA был вторым сервисом с профилем «gpu», и получалось так:
# сервис без профиля поднимается всегда, поэтому «--profile gpu up» запускал
# оба контейнера сразу, и второй падал с конфликтом за порт 8080. Надстройка
# же подменяет параметры того же сервиса, и контейнер остаётся один.
#
# Параметры берутся из файла .env, который создаёт установщик.

name: asrhub

services:

  asrhub:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        PROFILE: ${ASRHUB_PROFILE:-standard}
        # Явный список движков из .env. Пустой — берётся набор профиля.
        ENGINES: ${ASRHUB_ENGINES:-}
        ACCEL: cpu
        TORCH_INDEX: https://download.pytorch.org/whl/cpu
    image: asrhub:${ASRHUB_TAG:-latest}
    container_name: asrhub
    restart: unless-stopped
    # Срок остановки: по умолчанию у Docker десять секунд, а серверу нужно
    # дождаться открытых запросов (до 5 с) и вернуть идущие задания в
    # очередь — иначе SIGKILL приходит раньше, и каждое теряет попытку.
    stop_grace_period: 40s
    # Профиля у сервера нет намеренно: сервис с профилем не поднимается без
    # явного --profile, и «docker compose up -d» не запускал бы ничего.
    ports:
      # Адрес публикации, а не только порт. Установщик писал в .env
      # ASRHUB_HOST=127.0.0.1, если человек просил закрыть сервер снаружи, —
      # а Compose знал только про порт и открывал его на всех интерфейсах.
      # То есть установка «только для себя» выставляла сервер в сеть.
      - "${ASRHUB_HOST:-0.0.0.0}:${ASRHUB_PORT:-8080}:8080"
    volumes:
      - "${ASRHUB_DATA:-./data}:/data"
    environment:
      ASRHUB_DATA_DIR: /data
      ASRHUB_SERVER_PORT: 8080
      # Без значения — передаются, только если заданы в .env. Переменная
      # окружения важнее config.yaml, и с умолчаниями прямо здесь число
      # заданий и уровень журнала, сохранённые в интерфейсе, после каждого
      # перезапуска возвращались к 2 и INFO.
      ASRHUB_LOG_LEVEL:
      ASRHUB_MAX_CONCURRENT_JOBS:
      # Прежнее имя того же числа; точка входа переводит его сама.
      ASRHUB_WORKERS:
      # Адрес сервера языковой модели. 127.0.0.1 внутри контейнера — это сам
      # контейнер; модель на хосте — http://host.docker.internal:11434.
      ASRHUB_LLM_URL:
      # Владелец смонтированного тома. Если каталог на хосте принадлежит не
      # 1000:1000, укажите его uid:gid здесь — контейнер подстроится.
      ASRHUB_UID: ${ASRHUB_UID:-1000}
      ASRHUB_GID: ${ASRHUB_GID:-1000}
      HF_TOKEN: ${HF_TOKEN:-}
    # Хост — под именем host.docker.internal и на Linux (на Docker Desktop
    # оно есть и так): через него контейнер достаёт до сервера языковой
    # модели (Ollama), запущенного на той же машине.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      # /health отвечает 503 при недоступной базе — curl -fsS это заметит.
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    deploy:
      resources:
        limits:
          memory: ${ASRHUB_MEMORY_LIMIT:-16G}
    logging:
      driver: json-file
      options: { max-size: "32m", max-file: "5" }

  nginx:
    image: nginx:alpine
    container_name: asrhub-proxy
    restart: unless-stopped
    profiles: ["proxy"]
    ports:
      - "${ASRHUB_HTTP_PORT:-80}:80"
      - "${ASRHUB_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - "${ASRHUB_CERTS:-./certs}:/etc/nginx/certs:ro"
    depends_on:
      asrhub:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
