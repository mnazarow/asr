# ASR Hub — развёртывание через Docker Compose.
#
#   docker compose up -d                    запуск на процессоре
#   docker compose --profile gpu up -d      запуск с видеокартой NVIDIA
#   docker compose --profile proxy up -d    вместе с обратным прокси nginx
#
# Параметры берутся из файла .env, который создаёт установщик.

name: asrhub

services:

  asrhub:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        PROFILE: ${ASRHUB_PROFILE:-standard}
        ACCEL: cpu
        TORCH_INDEX: https://download.pytorch.org/whl/cpu
    image: asrhub:${ASRHUB_TAG:-latest}
    container_name: asrhub
    restart: unless-stopped
    profiles: ["", "cpu", "default"]
    ports:
      - "${ASRHUB_PORT:-8080}:8080"
    volumes:
      - "${ASRHUB_DATA:-./data}:/data"
    environment:
      ASRHUB_DATA_DIR: /data
      ASRHUB_SERVER_PORT: 8080
      ASRHUB_LOG_LEVEL: ${ASRHUB_LOG_LEVEL:-INFO}
      ASRHUB_MAX_CONCURRENT_JOBS: ${ASRHUB_WORKERS:-2}
      HF_TOKEN: ${HF_TOKEN:-}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    deploy:
      resources:
        limits:
          memory: ${ASRHUB_MEMORY_LIMIT:-16G}
    logging:
      driver: json-file
      options: { max-size: "32m", max-file: "5" }

  asrhub-gpu:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        PROFILE: ${ASRHUB_PROFILE:-full}
        ACCEL: cuda
        TORCH_INDEX: https://download.pytorch.org/whl/cu124
    image: asrhub:${ASRHUB_TAG:-cuda}
    container_name: asrhub-gpu
    restart: unless-stopped
    profiles: ["gpu"]
    ports:
      - "${ASRHUB_PORT:-8080}:8080"
    volumes:
      - "${ASRHUB_DATA:-./data}:/data"
    environment:
      ASRHUB_DATA_DIR: /data
      ASRHUB_DEVICE: cuda
      ASRHUB_COMPUTE_TYPE: float16
      ASRHUB_MAX_CONCURRENT_JOBS: ${ASRHUB_WORKERS:-2}
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
      HF_TOKEN: ${HF_TOKEN:-}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: ${GPU_COUNT:-1}
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 180s
    logging:
      driver: json-file
      options: { max-size: "32m", max-file: "5" }

  nginx:
    image: nginx:alpine
    container_name: asrhub-proxy
    restart: unless-stopped
    profiles: ["proxy"]
    ports:
      - "${ASRHUB_HTTP_PORT:-80}:80"
      - "${ASRHUB_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - "${ASRHUB_CERTS:-./certs}:/etc/nginx/certs:ro"
    depends_on:
      - asrhub
